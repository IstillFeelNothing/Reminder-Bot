[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "DTZ",  # flake8-datetimez: заборона наївних datetime
    "ASYNC",# flake8-async
    "RUF",  # ruff-specific
]
ignore = [
    "RUF001",  # кирилиця в рядках — не "неоднозначні" символи
    "RUF002",  # ... у docstring
    "RUF003",  # ... у коментарях
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ001"]  # тести навмисно створюють наївний datetime (контракт ValueError)

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["domain", "tests"]
